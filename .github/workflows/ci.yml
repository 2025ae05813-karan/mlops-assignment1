name: CI/CD Pipeline

# Trigger on pushes and PRs to main, plus manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------- #
  # 1. LINT  — static checks; the pipeline fails here on style/quality errors
  # ---------------------------------------------------------------------- #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check src/ api/ tests/ scripts/

  # ---------------------------------------------------------------------- #
  # 2. TEST  — unit tests for data, model, and API code (needs a trained model)
  # ---------------------------------------------------------------------- #
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data and train a model (API tests need the artifact)
        run: |
          python -m src.data_loader --sites cleveland
          python -m src.train

      - name: Run pytest with JUnit report
        run: pytest --junitxml=report/pytest-report.xml

      - name: Upload test report
        if: always()  # upload even when tests fail, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report/pytest-report.xml

  # ---------------------------------------------------------------------- #
  # 3. TRAIN — full training run; publishes the model + plots as artifacts
  # ---------------------------------------------------------------------- #
  train:
    name: Train & publish model
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dataset
        run: python -m src.data_loader --sites cleveland

      - name: Train with MLflow tracking
        run: python -m src.train --mlflow

      - name: Export experiment tracking summary
        run: python -m src.mlflow_summary

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.joblib
            models/model_metadata.json

      - name: Upload plots and tracking summary
        uses: actions/upload-artifact@v4
        with:
          name: training-reports
          path: |
            report/screenshots/*.png
            report/experiment_tracking_summary.md

      - name: Upload MLflow run store
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
