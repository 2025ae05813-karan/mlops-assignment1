# Prometheus scrape configuration (Assignment Task 8).
# Scrapes the FastAPI /metrics endpoint exposed by the
# prometheus-fastapi-instrumentator middleware.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "heart-disease-api"
    metrics_path: /metrics
    static_configs:
      # 'api' is the service name on the docker-compose network.
      - targets: ["api:8000"]
        labels:
          service: "heart-disease-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
