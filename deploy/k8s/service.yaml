# Service exposing the API via a LoadBalancer (Task 7 — "Expose via Load
# Balancer or Ingress"). On Minikube use `minikube tunnel` (or `minikube
# service`) and on Docker Desktop the LoadBalancer is reachable on localhost.
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      protocol: TCP
      port: 80          # external port
      targetPort: 8000  # container port
