# Optional Ingress (Task 7 alternative to LoadBalancer).
# Enable an ingress controller first:
#   Minikube:        minikube addons enable ingress
#   Docker Desktop:  install ingress-nginx (see deploy/k8s/README.md)
# Then add to /etc/hosts:  127.0.0.1  heart-disease.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-disease-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: heart-disease.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-disease-api
                port:
                  number: 80
