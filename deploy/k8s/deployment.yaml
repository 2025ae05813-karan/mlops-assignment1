# Kubernetes Deployment for the Heart Disease Risk Prediction API (Task 7).
# Runs 2 replicas for availability, with liveness/readiness probes wired to the
# API's /health endpoint and resource requests/limits for scheduling.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-disease-api
  template:
    metadata:
      labels:
        app: heart-disease-api
      annotations:
        # Tell Prometheus to scrape each pod's /metrics endpoint (Task 8).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: heart-disease-api
          # Local image built by `docker build -t heart-disease-api:latest .`
          # imagePullPolicy=IfNotPresent lets Minikube/Docker Desktop use the
          # locally built image without pushing to a registry.
          image: heart-disease-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
